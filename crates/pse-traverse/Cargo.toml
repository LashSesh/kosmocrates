[package]
name = "pse-traverse"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "PSE Traversal Agent v0.1 — post-symbolic traversal layer over PSE (FieldCube, DoFGraph, CollapsePlan, fail-closed gating)"

[dependencies]
pse-types = { path = "../pse-types" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# pse-core / pse-graph are pulled in only when the PSE bridge (`pse-commit`
# feature) is enabled, so the traversal kernel compiles standalone and stays
# fast to iterate on.
pse-core = { path = "../pse-core", optional = true }
pse-graph = { path = "../pse-graph", optional = true }

[features]
default = ["pse-commit", "horizon", "cognition"]
pse-commit = ["dep:pse-core", "dep:pse-graph"]

# ── PSE-TRAVERSE-HORIZON-03 (v0.3 null-centered horizon geometry) ──
# `horizon`              — enables the v0.3 kernel (HorizonChart,
#                          PhaseRay, ProjectionCone, CausalAdmissibility,
#                          CollapseEmissionDuality, HorizonCrossingGate,
#                          HorizonCertificate, run_horizon_v3).
# `horizon-projection-v2`— forward-compat flag: when v0.2 lands, links
#                          its outcome into the combined gate (today the
#                          horizon layer accepts a `ProjectionV2OutcomeRef`
#                          stub from callers).
# `horizon-pse-bridge`   — forward-compat flag: routes finalized
#                          emissions through the existing PSE-Bridge.
# `horizon-adapters`     — forward-compat flag for optional domain
#                          adapters; the v0.3 kernel itself stays
#                          domain-neutral.
horizon = []
horizon-cli = ["horizon"]
horizon-projection-v2 = ["horizon"]
horizon-pse-bridge = ["horizon", "pse-commit"]
horizon-adapters = ["horizon"]

# ── PSE-TRAVERSE-COGNITION-01 (v0.1 panoptic phase cognition kernel) ──
# `cognition`               — enables the v0.1 kernel (CanonicalCognitionState,
#                             CognitiveState5D, SpiralMemory, ConstraintLattice,
#                             HypercubePuzzle, PhasePanorama,
#                             ScorpioPhaseScheduler, WormholeHypernet,
#                             SelfModelTensor, FixpointCalibration,
#                             SingularityTrigger, CognitionCandidateBundle,
#                             run_cognition).
# `cognition-cli`           — builds the `pse-traverse-cognition` CLI.
# `cognition-simulation`    — feature-gates 5D simulation / stability probes.
# `cognition-spiral-memory` — feature-gates spiral memory + resonance addressing.
# `cognition-hypercube`     — feature-gates constraint lattice + hypercube puzzle.
# `cognition-scorpio-phase` — feature-gates the scorpio phase scheduler.
# `cognition-wormholes`     — feature-gates governed shortcuts.
# `cognition-calibration`   — feature-gates fixpoint calibration.
# `cognition-projection-handoff` — forward-compat flag to projection-v0.2.
cognition = []
cognition-cli = ["cognition"]
cognition-simulation = ["cognition"]
cognition-spiral-memory = ["cognition"]
cognition-hypercube = ["cognition"]
cognition-scorpio-phase = ["cognition"]
cognition-wormholes = ["cognition"]
cognition-calibration = ["cognition"]
cognition-projection-handoff = ["cognition"]

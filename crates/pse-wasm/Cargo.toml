[package]
readme = "README.md"
name = "pse-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "WebAssembly build of PSE — runs in any browser"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pse-types = { path = "../pse-types", version = "0.1.0" }
pse-core = { path = "../pse-core", version = "0.1.0" }
pse-graph = { path = "../pse-graph", version = "0.1.0" }
pse-extract = { path = "../pse-extract", version = "0.1.0" }
pse-cascade = { path = "../pse-cascade", version = "0.1.0" }
pse-evidence = { path = "../pse-evidence", version = "0.1.0" }
pse-registry = { path = "../pse-registry", version = "0.1.0" }
pse-topology = { path = "../pse-topology", version = "0.1.0" }
pse-constraint = { path = "../pse-constraint", version = "0.1.0" }
pse-scale = { path = "../pse-scale", version = "0.1.0" }
pse-navigator = { path = "../pse-navigator", version = "0.1.0" }
pse-scheduler = { path = "../pse-scheduler", version = "0.1.0" }
pse-replay = { path = "../pse-replay", version = "0.1.0" }
pse-manifest = { path = "../pse-manifest", version = "0.1.0" }
pse-pmhd = { path = "../pse-pmhd", version = "0.1.0" }
pse-memory = { path = "../pse-memory", version = "0.1.0" }
pse-capsule = { path = "../pse-capsule", version = "0.1.0" }
pse-swarm = { path = "../pse-swarm", version = "0.1.0" }
pse-store = { path = "../pse-store", version = "0.1.0", default-features = false, features = ["memory-only"] }
pse-adapter-tabular = { path = "../../adapters/pse-adapter-tabular", version = "0.1.0" }
wasm-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
console_error_panic_hook = { workspace = true }
getrandom = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

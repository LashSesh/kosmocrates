[package]
readme = "README.md"
name = "pse-eval-runner"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Real TrialExecutor that drives run_cognition() for agent-relevant workload families"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
name = "pse_eval_runner"
path = "src/lib.rs"

[features]
# Real LLM integration via Cerebras (OpenAI-compatible API).
# Requires CEREBRAS_API_KEY env var at runtime.
llm-agent = ["dep:reqwest"]

[dependencies]
pse-eval-matrix = { path = "../pse-eval-matrix", version = "0.1.0" }
pse-traverse = { path = "../pse-traverse", version = "0.1.0", features = [
    "cognition",
    "cognition-spiral-memory",
    "cognition-hypercube",
    "cognition-wormholes",
    "horizon",
    "topology",
] }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

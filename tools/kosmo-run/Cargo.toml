[package]
name = "kosmo-run"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Kosmocrates agent runner — drives the closed-loop pipeline→synthesize→materialize agent over a workspace using a Claude or Cerebras LLM backend"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "kosmo-run"
path = "src/main.rs"

[dependencies]
kosmo-core            = { path = "../../crates/kosmo-core", version = "0.1.0" }
kosmo-hyphae          = { path = "../../crates/kosmo-hyphae", version = "0.1.0" }
kosmo-intent          = { path = "../../crates/kosmo-intent", version = "0.1.0" }
kosmo-pipeline        = { path = "../../crates/kosmo-pipeline", version = "0.1.0" }
kosmo-store           = { path = "../../crates/kosmo-store", version = "0.1.0" }
kosmo-synthesizer     = { path = "../../crates/kosmo-synthesizer", version = "0.1.0" }
kosmo-synthesizer-llm = { path = "../../crates/kosmo-synthesizer-llm", version = "0.1.0" }
kosmo-agent           = { path = "../../crates/kosmo-agent", version = "0.1.0" }
kosmo-pse-bridge      = { path = "../../crates/kosmo-pse-bridge", version = "0.1.0" }
pse-adapter-kosmo     = { path = "../../adapters/pse-adapter-kosmo", version = "0.1.0" }
serde_json            = { workspace = true }

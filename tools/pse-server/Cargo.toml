[package]
name         = "pse-server"
version.workspace   = true
edition.workspace   = true
authors.workspace   = true
license.workspace   = true
description  = "PSE REST API server — exposes the Kosmocrates over HTTP/JSON"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "pse-server"
path = "src/main.rs"

[dependencies]
pse-core       = { path = "../../crates/pse-core", version = "0.1.0" }
pse-types      = { path = "../../crates/pse-types", version = "0.1.0" }
pse-graph      = { path = "../../crates/pse-graph", version = "0.1.0" }
pse-adapter-il = { path = "../../adapters/pse-adapter-il", version = "0.1.0" }
pse-nxalien-types             = { path = "../../crates/pse-nxalien-types", version = "0.1.0" }
pse-nxalien-evolve            = { path = "../../crates/pse-nxalien-evolve", version = "0.1.0" }
pse-constitutional-interceptor = { path = "../../crates/pse-constitutional-interceptor", version = "0.1.0" }
pse-exploratory                = { path = "../../crates/pse-exploratory", version = "0.1.0" }
pse-reasoning                  = { path = "../../crates/pse-reasoning", version = "0.1.0" }
axum        = { workspace = true }
tower       = { workspace = true }
tower-http  = { workspace = true }
tokio       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tempfile    = "3"
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

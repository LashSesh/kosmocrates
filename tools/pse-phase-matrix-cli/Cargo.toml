[package]
name = "pse-phase-matrix-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI for PHASEMATRIX-HIVEMIND-03 — cell-pool / cell-resonate / cluster-form / funnel-build / morph-step / converge / intent / cluster-dissolve / cluster-cycle / cluster-replay / cluster-verify (binary: phase-matrix)"

[dependencies]
phase-matrix = { path = "../../crates/phase-matrix", default-features = false, features = ["cell-substrate", "cell-cli", "cell-funnel-graph", "cell-morphodynamics", "cell-convergence", "cell-handoff"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }

[[bin]]
name = "phase-matrix"
path = "src/main.rs"

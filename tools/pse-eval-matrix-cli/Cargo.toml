[package]
name = "pse-eval-matrix-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI for PSE-EVAL-MATRIX-01 — init / validate / plan / run / replay / score / ablate / compare / report (binary: pse-eval-matrix)"

[dependencies]
pse-eval-matrix = { path = "../../crates/pse-eval-matrix", default-features = false, features = ["eval-matrix", "eval-cli", "eval-agent", "eval-cognition", "eval-streams", "eval-statistics", "eval-reports"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }

[[bin]]
name = "pse-eval-matrix"
path = "src/main.rs"

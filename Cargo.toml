[workspace]
resolver = "2"
members = [
    "crates/pse-types",
    "crates/pse-core",
    "crates/pse-graph",
    "crates/pse-extract",
    "crates/pse-cascade",
    "crates/pse-replay",
    "crates/pse-evidence",
    "crates/pse-registry",
    "crates/pse-manifest",
    "crates/pse-capsule",
    "crates/pse-scheduler",
    "crates/pse-topology",
    "crates/pse-store",
    "crates/pse-scale",
    "crates/pse-pmhd",
    "crates/pse-navigator",
    "crates/pse-constraint",
    "crates/pse-swarm",
    "crates/pse-memory",
    "crates/pse-metatron",
    "crates/pse-net",
    "crates/pse-wasm",
    "crates/pse-gateway",
    "crates/pse-cli",
    "crates/pse",
    "adapters/pse-adapter-binance",
    "adapters/pse-adapter-entsoe",
    "adapters/pse-adapter-seismo",
    "adapters/pse-adapter-weather",
    "adapters/pse-adapter-airquality",
    "adapters/pse-adapter-iot",
    "adapters/pse-adapter-syslog",
    "adapters/pse-adapter-vitals",
    "adapters/pse-adapter-tabular",
    "adapters/pse-adapter-modelmon",
    "crates/pse-traverse",
    "tools/pse-audit",
    "tools/pse-bench-bbo",
    "tools/pse-bench-gt",
    "tools/pse-demo",
    "tools/pse-traverse-cli",
    "tools/pse-traverse-horizon-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sebastian Klemm"]
license = "MIT"
description = "Post-Symbolic Engine — universal computation through topology, physics, and geometry"
repository = "https://github.com/lashsesh/pse"
homepage = "https://github.com/lashsesh/pse"
readme = "README.md"
keywords = ["streaming", "topology", "deterministic", "audit", "post-symbolic"]
categories = ["science", "algorithms", "data-structures"]
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.10"
petgraph = "0.8"
ordered-float = { version = "5", features = ["serde"] }
nalgebra = "0.33"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
aes-gcm = "0.10"
hkdf = "0.13"
rusqlite = { version = "0.39", features = ["bundled"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
rayon = "1.10"

# ─────────────────────────────────────────────────────────────────────────
# Release profile: tuned for the single-binary, single-thread-fast
# delivery contract. `lto = "thin"` is the sweet spot for this workspace
# (full LTO costs ~10× build time for ~2% throughput); `codegen-units = 1`
# is what unlocks the cross-crate inlining that the macro_step hot path
# relies on. `panic = "abort"` is intentional for the binaries — debug
# builds keep `unwind` for the test harness.
# ─────────────────────────────────────────────────────────────────────────
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "symbols"
panic = "abort"
overflow-checks = false

# Faster developer feedback: keep the dev profile fast to compile and
# diagnostic, but turn on bounds-checks and overflow-checks so anything
# subtle surfaces during local iteration.
[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

# `cargo bench` and the `bench_full` example need the same codegen as
# release, but keep some debug info so `perf` / `flamegraph` are useful.
[profile.bench]
inherits = "release"
debug = true
strip = "none"

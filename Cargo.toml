[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sebastian Klemm"]
license = "MIT"
description = "Kosmocrates — multi-layer epistemic operating system: PSE crystallization, NxAlien governance, Infinity Ledger, HDAG, QTIC"
repository = "https://github.com/LashSesh/kosmocrates"
homepage = "https://github.com/LashSesh/kosmocrates"
readme = "README.md"
keywords = ["kosmocrates", "topology", "deterministic", "epistemic", "post-symbolic"]
categories = ["science", "algorithms", "data-structures"]
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha2 = "0.11"
petgraph = "0.8"
ordered-float = { version = "5", features = ["serde"] }
nalgebra = "0.34"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
aes-gcm = "0.10"
hkdf = "0.13"
rusqlite = { version = "0.40", features = ["bundled"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
rayon = "1.10"
reqwest = { version = "0.13", features = ["blocking", "json"] }
anyhow   = "1"
ndarray  = "0.17"
rand     = "0.9"
rand_distr = "0.6"

# ─────────────────────────────────────────────────────────────────────────
# Release profile: tuned for the single-binary, single-thread-fast
# delivery contract. `lto = "thin"` is the sweet spot for this workspace
# (full LTO costs ~10× build time for ~2% throughput); `codegen-units = 1`
# is what unlocks the cross-crate inlining that the macro_step hot path
# relies on. `panic = "abort"` is intentional for the binaries — debug
# builds keep `unwind` for the test harness.
# ─────────────────────────────────────────────────────────────────────────
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "symbols"
panic = "abort"
overflow-checks = false

# Faster developer feedback: keep the dev profile fast to compile and
# diagnostic, but turn on bounds-checks and overflow-checks so anything
# subtle surfaces during local iteration.
[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

# `cargo bench` and the `bench_full` example need the same codegen as
# release, but keep some debug info so `perf` / `flamegraph` are useful.
[profile.bench]
inherits = "release"
debug = true
strip = "none"

[package]
name = "pse-adapter-il"
version.workspace = true
edition.workspace = true
description = "PSE × Infinity Ledger bridge: converts SemanticCrystals into IL TIC blocks, 8D HNSW vectors, and file-based ledger. Optionally drives MEFCore::process() directly."
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
pse-types      = { path = "../../crates/pse-types", version = "0.1.0" }
serde          = { workspace = true }
serde_json     = { workspace = true }
sha2           = { workspace = true }

# Infinity Ledger crates — vendored from infinityledger-r-main.zip.
# Although vendors/infinityledger/ carries its own workspace manifest,
# cargo auto-adopts path dependencies living inside this repository into
# the ROOT workspace: these six crates build as ordinary members, and
# their `*.workspace = true` keys resolve against the root Cargo.toml.
# Keep that in mind when bumping root [workspace.dependencies].
mef-core       = { path = "../../vendors/infinityledger/mef-core", version = "0.1.0",       optional = true }
mef-ingestion  = { path = "../../vendors/infinityledger/mef-ingestion", version = "0.1.0",   optional = true }
mef-solvecoagula = { path = "../../vendors/infinityledger/mef-solvecoagula", version = "0.1.0", optional = true }
mef-tic        = { path = "../../vendors/infinityledger/mef-tic", version = "0.1.0",         optional = true }
mef-ledger     = { path = "../../vendors/infinityledger/mef-ledger", version = "0.1.0",      optional = true }
mef-spiral     = { path = "../../vendors/infinityledger/mef-spiral", version = "0.1.0",      optional = true }

[features]
# Enable direct MEFCore pipeline (requires IL workspace to compile)
il-pipeline = ["mef-core", "mef-ingestion", "mef-solvecoagula", "mef-tic", "mef-ledger", "mef-spiral"]
# All IL features
full = ["il-pipeline"]

[dev-dependencies]
tempfile = "3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package]
readme = "README.md"
name = "pse-adapter-seismo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "PSE domain adapter for USGS earthquake seismology data"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
pse-types = { path = "../../crates/pse-types", version = "0.1.0" }
pse-core = { path = "../../crates/pse-core", version = "0.1.0" }
pse-graph = { path = "../../crates/pse-graph", version = "0.1.0" }
reqwest = { version = "0.13", features = ["json"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = "1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

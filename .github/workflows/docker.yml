name: Docker

# Builds and publishes the `pse-server` container image to GitHub
# Container Registry on every push to `main` (tagged `:edge`) and on
# every version tag (tagged `:vX.Y.Z` and `:latest`).
on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/docker.yml'

env:
  REGISTRY: ghcr.io
  # GHCR rejects uppercase characters in image names, and
  # ${{ github.repository }} preserves the owner's case (LashSesh).
  # Hardcoding the lowercase form sidesteps the validation failure.
  IMAGE_NAME: lashsesh/kosmocrates/pse-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (for linux/arm64 cross-build)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Kosmocrates pse-server
            org.opencontainers.image.description=Kosmocrates REST API server (PSE crystallization, NxAlien, Infinity Ledger)
            org.opencontainers.image.vendor=Sebastian Klemm
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          # PRs get a build-only check; main + tags actually push.
          push: ${{ github.event_name != 'pull_request' }}
          # `linux/arm64` is built via QEMU on the same runner. If
          # build times become a problem, split it onto a native
          # arm64 runner via `runs-on: ubuntu-24.04-arm`.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

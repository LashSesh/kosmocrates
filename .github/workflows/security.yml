name: Supply chain

# Enforces the cargo-deny invariants documented in deny.toml:
# advisories, licenses, bans, sources. This complements (and over time
# will replace) the non-blocking cargo-audit job in ci.yml — cargo-deny
# is a strict superset.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Re-run weekly so a newly published advisory in the RustSec DB
    # surfaces against the unchanged dependency graph even if no PR is
    # in flight.
    - cron: '17 6 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    name: cargo-deny (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [advisories, licenses, bans, sources]
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.check }}
          # The action's `arguments` input defaults to `--all-features`,
          # so the checked graph includes optional features (e.g. the
          # vendored IL crates behind pse-adapter-il's `il-pipeline`).
          # That is broader than what ships by default — we keep it: a
          # feature anyone can enable is part of the supply chain.
          rust-version: stable

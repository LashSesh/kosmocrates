# Standalone mini-workspace — deliberately excluded from the main workspace
# so that `cargo build --workspace` does not require Python/maturin.
# Build this with: maturin develop --release  (from this directory)
[workspace]

[package]
name = "pse-python"
version = "0.1.0"
edition = "2021"
authors = ["Sebastian Klemm"]
license = "MIT"
description = "Python bindings for PSE — Kosmocrates"
repository = "https://github.com/lashsesh/pse"
homepage = "https://github.com/lashsesh/pse"
readme = "README.md"

[lib]
name = "pse_core"
crate-type = ["cdylib"]

[dependencies]
pse-core  = { path = "../../crates/pse-core" }
pse-types = { path = "../../crates/pse-types" }
pse-graph = { path = "../../crates/pse-graph" }
# abi3-py38 binds against the stable Python ABI: a single wheel works
# on every CPython >= 3.8. This is what makes a sane PyPI distribution
# matrix (5 platform wheels × 1 ABI) instead of (5 platforms × N python
# versions). The build path remains `maturin build/develop`.
pyo3      = { version = "0.22", features = ["extension-module", "abi3-py38"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Mirror workspace profile settings so release builds are fast.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
